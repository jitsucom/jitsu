# Jitsu Dev Helm Chart Values
# This chart deploys services using local binaries mounted via hostPath

# Path to the project root on the host machine, mounted into containers.
# Required — no default. dev-deploy.sh sets it automatically; for direct
# helm invocations pass --set projectRoot=<absolute path to your checkout>.
projectRoot: ""

# Environment variables
env:
  # Common to all services
  common:
    LOG_FORMAT: "text"
  # Per-service overrides — a key set here wins over env.common, computed
  # URLs (CONSOLE_URL, REPOSITORY_URL, ...) and chart defaults for that service
  ingest: {}
  bulker: {}
  rotor: {}
  profiles: {}
  syncctl: {}
  operator:
    FUNCTIONS_SERVER_IMAGE: jitsucom/functions-server:beta
  console:
    NEXTAUTH_URL: "http://localhost:3000"
    ENABLE_CREDENTIALS_LOGIN: true
    SEED_USER_EMAIL: admin@example.com
    SEED_USER_PASSWORD: changeme
    JITSU_PUBLIC_URL: "http://localhost:3000"
    JWT_SECRET: "dev-jwt-secret-change-in-production"
    SYNCS_ENABLED: true

# In-cluster dependencies — toggle each with scaling.<name>.replicas below.
# Images are pinned to tested tags rather than :latest so a floating image
# can't change behavior between deploys or force an Always pull that fails
# when the registry is unreachable. Override to upgrade.
#
# The dev credentials below are baked into the computed connection URLs
# (see jitsu-dev.databaseUrl / clickhouseUrl / mongodbUrl in _helpers.tpl);
# they only protect an in-cluster dev instance, so simple values are fine.
kafka:
  image: docker.redpanda.com/redpandadata/redpanda:v26.1.12
  imagePullPolicy: IfNotPresent
postgres:
  image: postgres:14
  imagePullPolicy: IfNotPresent
  password: jitsu-dev
clickhouse:
  image: clickhouse/clickhouse-server:25.4-alpine
  imagePullPolicy: IfNotPresent
  password: jitsu-dev
mongodb:
  image: mongo:7
  imagePullPolicy: IfNotPresent
  password: jitsu-dev

# Service scaling (set replicas to 0 to disable)
scaling:
  # In-cluster single-node dependencies. On/off only — each Deployment always
  # runs one replica (fixed identity + RWO data volume). Set 0 to use an
  # external instance via env.common.KAFKA_BOOTSTRAP_SERVERS / DATABASE_URL /
  # CLICKHOUSE_URL / MONGODB_URL instead.
  kafka:
    replicas: 1
  postgres:
    replicas: 1
  clickhouse:
    replicas: 1
  mongodb:
    replicas: 1
  ingest:
    replicas: 1
  bulker:
    replicas: 1
  rotor:
    replicas: 1
  profiles:
    replicas: 1
  syncctl:
    replicas: 1
  operator:
    replicas: 1
  console:
    replicas: 1
