# Jitsu Dev Helm Chart Values
# This chart deploys services using local binaries mounted via hostPath

# Path to the project root on the host machine, mounted into containers.
# Required — no default. dev-deploy.sh sets it automatically; for direct
# helm invocations pass --set projectRoot=<absolute path to your checkout>.
projectRoot: ""

# Environment variables
env:
  # Common to all services
  common:
    LOG_FORMAT: "text"
  # Per-service overrides — a key set here wins over env.common, computed
  # URLs (CONSOLE_URL, REPOSITORY_URL, ...) and chart defaults for that service
  ingest: {}
  bulker: {}
  rotor: {}
  profiles: {}
  syncctl: {}
  operator:
    FUNCTIONS_SERVER_IMAGE: jitsucom/functions-server:beta
  console:
    NEXTAUTH_URL: "http://localhost:3000"
    ENABLE_CREDENTIALS_LOGIN: true
    SEED_USER_EMAIL: admin@example.com
    SEED_USER_PASSWORD: changeme
    JITSU_PUBLIC_URL: "http://localhost:3000"
    JWT_SECRET: "dev-jwt-secret-change-in-production"
    SYNCS_ENABLED: true

# Dependencies (Kafka, PostgreSQL, ClickHouse, MongoDB) are deployed by the
# separate ../helm-deps chart — dev-deploy.sh installs it first and waits for
# it to become healthy before deploying this chart. Their connection URLs
# reach the services through the `jitsu-deps-urls` Secret (envFrom); to use an
# external instance, disable it in helm-deps/values.yaml and set the matching
# env.common.KAFKA_BOOTSTRAP_SERVERS / DATABASE_URL / CLICKHOUSE_URL /
# MONGODB_URL here (explicit env wins over envFrom).

# Service scaling (set replicas to 0 to disable)
scaling:
  ingest:
    replicas: 1
  bulker:
    replicas: 1
  rotor:
    replicas: 1
  profiles:
    replicas: 1
  syncctl:
    replicas: 1
  operator:
    replicas: 1
  console:
    replicas: 1

# Bulker configuration
bulker:
  # Internal "metrics" ClickHouse destination preinitialized in bulker
  # (special: "metrics"). Bulker writes pipeline metrics + active-user pings
  # here and auto-creates the predefined tables (metrics, active_incoming). It
  # is rendered into the bulker Deployment as the BULKER_INTERNAL_METRICS_DESTINATION
  # env var (bulker loads every BULKER_INTERNAL* var as a destination config).
  #
  # Connection resolution, per field (highest precedence first):
  #   1. an explicit value set below;
  #   2. derived from env.common.CLICKHOUSE_URL when set — hostname, the
  #      user:password userinfo, and the /database path; scheme https -> the
  #      `clickhouse-secure` protocol, otherwise `clickhouse`;
  #   3. the in-cluster helm-deps ClickHouse fallback
  #      (clickhouse / default / default / jitsu-dev / clickhouse).
  # So pointing the stack at an external ClickHouse via env.common.CLICKHOUSE_URL
  # moves the metrics destination with it — no split-brain where bulker writes
  # metrics to one ClickHouse while the console reads them from another. Override
  # a field only when the URL can't express it: a native port/protocol the HTTP
  # URL doesn't imply, a URL-encoded password, or a differing metrics database
  # (prod: newjitsu_metrics). `cluster` empty = single-node (no ON CLUSTER);
  # prod uses `jitsu-cluster`. Set enabled: false to omit the env var entirely.
  internalMetricsDestination:
    enabled: true
    hosts: []
    protocol: ""
    database: ""
    username: ""
    password: ""
    cluster: ""
    loadAsJson: true
    options:
      mode: batch
      frequency: 1
      deduplicate: false
      batchSize: 100000
