# Jitsu Helm Chart Values

# Deployment mode.
#
#   dev  — services are built from source inside init containers against a
#          hostPath-mounted checkout, and run from generic base images
#          (golang / node / debian). Requires projectRoot. This is what the
#          chart has always done and remains the default.
#   prod — services run published jitsucom/* images; no source build, no
#          hostPath, projectRoot unused.
#
# `prod` is not complete yet (JITSU-48): this release adds only the image
# resolution below. Until per-service templating lands, setting mode=prod
# changes which image is pulled but not the init containers or volumes, so it
# will not produce a working deployment. Leave it on dev.
mode: dev

# Container images.
#
# Defaults apply in prod mode; in dev mode the base images are used instead
# and these are ignored unless a per-service `repository` is set explicitly.
image:
  # Registry / org that publishes the service images.
  registry: jitsucom
  # Tag used for every service without its own. The release workflow tags the
  # stable channel as both `latest` and `stable`; other channels are tagged
  # with the channel name.
  tag: latest
  pullPolicy: IfNotPresent

# Per-service image overrides. Empty by default — a service falls back to the
# mode default. Setting `repository` pins that service in BOTH modes, which is
# how a single service is run from an image while the rest build from source.
#
#   images:
#     rotor:
#       repository: jitsucom/rotor
#       tag: my-branch.abc1234
#       pullPolicy: Always
# NOTE: `rotor` and `profiles` run the SAME image (profiles is rotor with
# ROTOR_MODE=profiles) but are separate keys here. Pinning one and not the other
# gives you a split-version deployment — set both, or neither.
images:
  ingest: {}
  bulker: {}
  rotor: {}
  profiles: {}
  syncctl: {}
  operator: {}
  console: {}

# Path to the project root on the host machine, mounted into containers.
# Required in dev mode — no default. dev-deploy.sh sets it automatically; for
# direct helm invocations pass --set projectRoot=<absolute path to your
# checkout>. Unused in prod mode.
projectRoot: ""

# Optional syncctl-only source mount, for testing a worktree without replacing
# the checkout used by the other development services.
syncctlProjectRoot: ""

# Reverse ETL jobs use a separately built retl-runner image, not the host checkout.
# Provision the runtime Secret and cloud IAM before enabling. See README.md.
reverseEtl:
  enabled: false
  runnerImage: "" # Required when enabled; use a version tag or digest from this rollout.
  runtimeSecret: "" # Existing Secret in this release's namespace; no credentials in values.
  # Optional controller-only credentials (e.g. SYNCCTL_DATABASE_URL and auth tokens).
  controllerSecret: ""
  serviceAccount:
    create: true
    name: "" # Defaults to <release>-retl-runner; required if create=false.
    annotations: {} # GKE Workload Identity / EKS IRSA; never applied to sync-pod.
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
      ephemeral-storage: "1Gi"
    limits:
      cpu: "1"
      memory: "8Gi"
      ephemeral-storage: "4Gi"
  scratchSizeLimit: "2Gi" # Disk-backed /tmp emptyDir, <= ephemeral-storage limit.

# Additional controller-only Secret/ConfigMap env sources, after chart defaults.
# Useful when syncctl uses a Mac-hosted console and a separate development DB.
syncctlExtraEnvFrom: []

# Environment variables
env:
  # Common to all services
  common:
    LOG_FORMAT: "text"
  # Per-service overrides — a key set here wins over env.common, computed
  # URLs (CONSOLE_URL, REPOSITORY_URL, ...) and chart defaults for that service
  ingest: {}
  bulker: {}
  rotor: {}
  profiles: {}
  syncctl: {}
  # FUNCTIONS_SERVER_IMAGE is a template default (jitsu.functionsServerImage):
  # beta in dev, image.registry/image.tag in prod. Set it here to override.
  operator: {}
  console:
    ENABLE_CREDENTIALS_LOGIN: true
    SEED_USER_EMAIL: admin@example.com
    SEED_USER_PASSWORD: changeme
    # NEXTAUTH_URL and JITSU_PUBLIC_URL are template defaults
    # (jitsu.consolePublicUrl): http://localhost:3000 in dev, and the Ingress
    # host in prod when one is configured.
    #
    # Set them here when the chart cannot know the public URL: a prod install
    # with no Ingress (exposed by an external load balancer or service mesh)
    # falls back to http://localhost:3000, which will break sign-in redirects
    # and the tracking snippet.
    JWT_SECRET: "dev-jwt-secret-change-in-production"
    SYNCS_ENABLED: true

# Dependencies (Kafka, PostgreSQL, ClickHouse, MongoDB) are deployed by the
# separate ../helm-deps chart — dev-deploy.sh installs it first and waits for
# it to become healthy before deploying this chart. Their connection URLs
# reach the services through the `jitsu-deps-urls` Secret (envFrom); to use an
# external instance, disable it in helm-deps/values.yaml and set the matching
# env.common.KAFKA_BOOTSTRAP_SERVERS / DATABASE_URL / CLICKHOUSE_URL /
# MONGODB_URL here (explicit env wins over envFrom).

# Service type overrides. Empty by default: dev keeps the LoadBalancers that
# `minikube tunnel` publishes, prod forces ClusterIP for every service so no
# service gets its own billed cloud load balancer. Set a type here to override
# both.
#
#   service:
#     console:
#       type: LoadBalancer
service: {}

# External entry point. Prod only — in dev, `minikube tunnel` already publishes
# the LoadBalancer services.
#
# Scoped to console + ingest deliberately: bulker and rotor are internal in
# production and are not exposed here. Enabling without a host fails the render
# rather than producing an Ingress with no rules.
ingress:
  enabled: false
  # Ingress controller class, e.g. nginx, traefik, or gce on GKE.
  className: ""
  # Controller- and issuer-specific annotations, e.g. cert-manager.io/cluster-issuer.
  annotations: {}
  hosts:
    # Console UI, e.g. jitsu.example.com
    console: ""
    # Event collection endpoint, e.g. events.example.com
    ingest: ""
  tls:
    enabled: false
    # Existing TLS Secret. Leave empty when the controller or cert-manager
    # provisions the certificate from the host list.
    secretName: ""

# Service scaling (set replicas to 0 to disable)
scaling:
  ingest:
    replicas: 1
  bulker:
    replicas: 1
  rotor:
    replicas: 1
  profiles:
    replicas: 1
  syncctl:
    replicas: 1
  operator:
    replicas: 1
  console:
    replicas: 1
