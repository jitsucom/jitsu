{{- if gt (int .Values.scaling.console.replicas) 0 }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  labels:
    {{- include "jitsu-dev.labels" . | nindent 4 }}
    app.kubernetes.io/name: console
spec:
  replicas: {{ .Values.scaling.console.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: console
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: console
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: console
          image: node:24-bookworm
          workingDir: /cache/workspace/webapps/console
          command:
            - sh
            - -c
            - |
              apt-get update -qq && apt-get install -y -qq rsync > /dev/null 2>&1

              # Background rsync: every 2s, sync only actually changed files
              (while true; do
                sleep 2
                rsync -a --checksum \
                  --exclude='node_modules' --exclude='.next' --exclude='.turbo' \
                  --exclude='docker/data' --exclude='*.log' \
                  /project/webapps/ /cache/workspace/webapps/
                rsync -a --checksum \
                  --exclude='node_modules' \
                  /project/libs/ /cache/workspace/libs/
                rsync -a --checksum \
                  --exclude='node_modules' \
                  /project/types/ /cache/workspace/types/
              done) &

              cd /cache/workspace/webapps/console
              npx tsx scripts/manage.ts seed
              exec npx next dev -H 0.0.0.0 -p 3000
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - secretRef:
                name: jitsu-secrets
          env:
            # Empty *_PORT entries override K8s-injected service-link vars
            # (tcp://...) that break zod number coercion.
            # MAINTENANCE_CONFIG_FILE: maintenance descriptor mounted from
            # `jitsu-console-maintenance` (optional ConfigMap, key
            # `maintenance.json`). Manage via
            # webapps/console/scripts/maintenance-mode.sh.
            {{- include "jitsu-dev.env" (dict "ctx" . "service" "console"
                  "extra" (dict
                    "BULKER_PORT" ""
                    "ROTOR_PORT" ""
                    "SYNCCTL_PORT" ""
                    "INGMGR_PORT" ""
                    "MAINTENANCE_CONFIG_FILE" "/etc/jitsu/maintenance/maintenance.json")) | nindent 12 }}
          volumeMounts:
            - name: project
              mountPath: /project
              readOnly: true
            - name: node-cache
              mountPath: /cache
            - name: maintenance
              mountPath: /etc/jitsu/maintenance
              readOnly: true
          livenessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            initialDelaySeconds: 120
            periodSeconds: 15
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 10
          startupProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
      volumes:
        - name: project
          hostPath:
            path: {{ include "jitsu-dev.projectRoot" . }}
            type: Directory
        - name: node-cache
          persistentVolumeClaim:
            claimName: node-cache
        # `optional: true` so the pod boots cleanly when no maintenance window
        # is configured (the volume mounts as an empty dir; missing config
        # file → load() returns "no maintenance"). Create the CM via
        # `webapps/console/scripts/maintenance-mode.sh start` to enable
        # maintenance — propagates to running pods within ~1min via kubelet
        # sync; no restart needed.
        - name: maintenance
          configMap:
            name: jitsu-console-maintenance
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: console
  labels:
    {{- include "jitsu-dev.labels" . | nindent 4 }}
    app.kubernetes.io/name: console
spec:
  type: LoadBalancer
  ports:
    - port: 3000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: console
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
