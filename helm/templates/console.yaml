{{- if gt (int .Values.scaling.console.replicas) 0 }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  labels:
    {{- include "jitsu-dev.labels" . | nindent 4 }}
    app.kubernetes.io/name: console
spec:
  replicas: {{ .Values.scaling.console.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: console
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: console
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      initContainers:
        # Build the console from the mounted source into a production dist,
        # the same model as bulker/rotor/etc: compile in an init container,
        # run the output in the main container. Replaces the previous in-pod
        # `next dev` + rsync hot-reload, which was the largest memory consumer
        # in the dev stack (JITSU-108).
        #
        # For console UI iteration use `pnpm console:dev` on the host with
        # `scaling.console.replicas: 0` — faster and lighter than any
        # in-cluster dev server. This path exists so you can test your local
        # console source in a real cluster, rebuilt on redeploy.
        #
        # Ordering is guaranteed: install-job is a pre-install/pre-upgrade
        # helm hook (weight -5), so pnpm install and prisma generate have
        # completed before this pod is created.
        #
        # `.next` persists on the node-cache PVC between deploys, so this is
        # incremental. The dotfile exclusion below means a stale `.next` from the
        # host is never copied over the cached one; a pnpm-lock.yaml change makes
        # the install job wipe the workspace and forces a cold build.
        #
        # The source is re-synced here, not just by the install job: that job is
        # a helm hook, so it only runs on deploy/upgrade. `dev-deploy.sh restart
        # console` is a plain rollout restart, and without this sync it would
        # rebuild whatever source was last copied — silently shipping stale code.
        # Same reason bulker's init container copies from /project before it
        # compiles.
        - name: build
          image: node:24-bookworm
          workingDir: /cache/workspace/webapps/console
          command:
            - sh
            - -c
            - |
              echo "Syncing console source from /project..."
              cd /project && tar \
                --exclude='node_modules' --exclude='.[^/]*' --exclude='*.log' \
                -cf - webapps libs types | tar -xf - -C /cache/workspace
              cd /cache/workspace/webapps/console
              echo "Building console (next build)..."
              npx next build
              echo "Build complete"
          envFrom:
            - secretRef:
                name: jitsu-secrets
            - secretRef:
                name: jitsu-deps-urls
                optional: true
          env:
            {{- include "jitsu-dev.env" (dict "ctx" . "service" "console"
                  "extra" (dict
                    "BULKER_PORT" ""
                    "ROTOR_PORT" ""
                    "SYNCCTL_PORT" ""
                    "INGMGR_PORT" "")) | nindent 12 }}
          volumeMounts:
            - name: project
              mountPath: /project
              readOnly: true
            - name: node-cache
              mountPath: /cache
      containers:
        - name: console
          image: node:24-bookworm
          workingDir: /cache/workspace/webapps/console
          command:
            - sh
            - -c
            - |
              cd /cache/workspace/webapps/console
              # On a fresh install the db-push job may still be applying the
              # schema — retry seed until it succeeds instead of silently
              # starting without a seeded admin user.
              until npx tsx scripts/manage.ts seed; do
                echo "seed failed (database schema not ready yet?), retrying in 5s..."
                sleep 5
              done
              # Create the events-log ClickHouse tables (powers Live Events).
              # Nothing else runs this in the dev chart — in prod the
              # admin/events-log-init route does. Best-effort: retry a few times
              # for a not-yet-ready ClickHouse, then continue so a disabled or
              # broken ClickHouse can't wedge console startup.
              for i in $(seq 1 12); do
                npx tsx scripts/manage.ts events-log-init && break
                echo "events-log-init failed (clickhouse not ready yet?), retry $i/12 in 5s..."
                sleep 5
              done
              exec npx next start -H 0.0.0.0 -p 3000
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - secretRef:
                name: jitsu-secrets
            # Connection URLs of the in-cluster dependencies (helm-deps chart).
            # Listed after jitsu-secrets so its keys win over any legacy URL
            # keys there; explicit env entries below still take precedence.
            - secretRef:
                name: jitsu-deps-urls
                optional: true
          env:
            # Empty *_PORT entries override K8s-injected service-link vars
            # (tcp://...) that break zod number coercion.
            # MAINTENANCE_CONFIG_FILE: maintenance descriptor mounted from
            # `jitsu-console-maintenance` (optional ConfigMap, key
            # `maintenance.json`). Manage via
            # webapps/console/scripts/maintenance-mode.sh.
            {{- include "jitsu-dev.env" (dict "ctx" . "service" "console"
                  "extra" (dict
                    "BULKER_PORT" ""
                    "ROTOR_PORT" ""
                    "SYNCCTL_PORT" ""
                    "INGMGR_PORT" ""
                    "MAINTENANCE_CONFIG_FILE" "/etc/jitsu/maintenance/maintenance.json")) | nindent 12 }}
          volumeMounts:
            - name: node-cache
              mountPath: /cache
            - name: maintenance
              mountPath: /etc/jitsu/maintenance
              readOnly: true
          livenessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            initialDelaySeconds: 120
            periodSeconds: 15
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 10
          startupProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
      volumes:
        - name: project
          hostPath:
            path: {{ include "jitsu-dev.projectRoot" . }}
            type: Directory
        - name: node-cache
          persistentVolumeClaim:
            claimName: node-cache
        # `optional: true` so the pod boots cleanly when no maintenance window
        # is configured (the volume mounts as an empty dir; missing config
        # file → load() returns "no maintenance"). Create the CM via
        # `webapps/console/scripts/maintenance-mode.sh start` to enable
        # maintenance — propagates to running pods within ~1min via kubelet
        # sync; no restart needed.
        - name: maintenance
          configMap:
            name: jitsu-console-maintenance
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: console
  labels:
    {{- include "jitsu-dev.labels" . | nindent 4 }}
    app.kubernetes.io/name: console
spec:
  type: LoadBalancer
  ports:
    - port: 3000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: console
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
