{{/*
Creates the first admin user and workspace on a fresh prod install.

Without this, prod comes up with a migrated database and no UserProfile, so
nobody can log in. The published console image only runs the seed when
SEED_DEMO_CONFIGURATION is set — which also creates demo connections — so
setting SEED_USER_EMAIL/SEED_USER_PASSWORD alone does nothing. This Job calls
the same code path directly instead.

Idempotent: seedUserAndWorkspace() is a no-op unless the profile table is empty
(webapps/console/lib/server/seed.ts:88), so re-running on upgrade never creates
a second user or resets a password.

Dev does not need it — the dev console runs `next dev` against source, and
dev-deploy.sh already seeds through the normal boot path.

The NODE_PATH dance is required by the image layout: manage.js needs
@prisma/client, which ships only inside the pnpm store rather than at the top
level of node_modules. Borrowed from github.com/stafftastic/jitsu-chart.
*/}}
{{- /* Gated on whether the console runs from source, NOT on mode. The console's
       own entrypoint seeds inline, but only in the source-build path; a pinned
       jitsucom/console image runs docker-start-console.sh, which seeds only when
       SEED_DEMO_CONFIGURATION is set — and that also creates demo connections,
       so the dev values deliberately leave it unset. Keying this on mode meant
       `mode=dev` with images.console.repository set produced a migrated database
       with no UserProfile and nobody able to sign in. */}}
{{- if and (not (include "jitsu.devScaffold" (dict "ctx" . "service" "console"))) .Values.seed.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  # Stable name — see the note on token-generator's Job. A per-revision name
  # leaks a completed Job and Pod on every upgrade.
  name: seed
  labels:
    {{- include "jitsu.labels" . | nindent 4 }}
    app.kubernetes.io/name: seed
  annotations:
    # post-install/post-upgrade: the console image migrates the schema on its own
    # startup, so the tables have to exist before this runs.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seed
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      # Kubernetes injects a service-link env var per Service in the namespace:
      # a Service named `bulker` becomes BULKER_PORT=tcp://10.x.x.x:3042. Those
      # names collide with Jitsu's own BULKER_PORT / ROTOR_PORT / SYNCCTL_PORT,
      # which console's env schema parses as numbers, so manage.js exits with
      # "expected number, received nan" before it can seed. The Deployments do
      # not hit this because they set those vars explicitly; this Job does not.
      enableServiceLinks: false
      initContainers:
        # The console migrates the schema on its own startup, and this Job is
        # only ordered by hook weight — Helm does not wait for the Deployment to
        # become ready unless the install passes --wait, which the documented
        # command does not. Without this gate `manage.js seed` can run against a
        # database with no tables and burn its small backoff before the console
        # is up. /api/healthcheck returns 200 only once prisma has connected, so
        # this gate is what stops `manage.js seed` racing the migration. The URL
        # comes from jitsu.consoleUrl, not a hardcoded Service name: with
        # scaling.console.replicas=0 there is no `console` Service, and polling
        # one that does not exist made every install fail after the 5-minute
        # timeout.
        # waiting on it waits for exactly the right thing.
        - name: wait-for-console
          image: {{ .Values.tokenGenerator.image | quote }}
          command:
            - sh
            - -c
            - |
              set -eu
              i=0
              until wget -q -O /dev/null "{{ include "jitsu.consoleUrl" . }}/api/healthcheck"; do
                i=$((i+1))
                if [ "$i" -ge 60 ]; then
                  echo "console did not become healthy after 5 minutes"
                  exit 1
                fi
                echo "waiting for console to be ready and the schema to be applied..."
                sleep 5
              done
              echo "console is ready"
      containers:
        - name: seed
          image: {{ include "jitsu.image" (dict "ctx" . "service" "console" "dev" "node:24-bookworm" "prod" "console") }}
          {{- with (include "jitsu.imagePullPolicy" (dict "ctx" . "service" "console")) }}
          imagePullPolicy: {{ . }}
          {{- end }}
          {{- with (include "jitsu.resources" (dict "ctx" . "service" "seed")) }}
          {{- . | nindent 10 }}
          {{- end }}
          command:
            - sh
            - -c
            - |
              set -eu
              export NODE_PATH="$(ls -d /app/node_modules/.pnpm/@prisma+client*/node_modules | head -n 1)"
              exec node /app/webapps/console/build/manage.js seed
          envFrom:
            - secretRef:
                name: jitsu-secrets
            - secretRef:
                name: jitsu-deps-urls
                optional: true
          env:
            {{- /* Mirrors console.yaml. In dev, dev-deploy.sh creates jitsu-secrets
                   with only the eight inter-service keys, so SEED_USER_PASSWORD and
                   JWT_SECRET are not in the Secret this Job pulls via envFrom. They
                   come from jitsu.devCredential instead. Without them the container
                   has SEED_USER_EMAIL but no password, and seedUserAndWorkspace()
                   takes its no-op branch — the Job runs, reports success, and
                   creates no user. Prod is unaffected: there the token-generator
                   writes both keys into the Secret and devCredential yields
                   nothing. */}}
            {{- $seedExtra := dict }}
            {{- with (include "jitsu.devCredential" (dict "ctx" . "key" "JWT_SECRET")) }}
            {{- $_ := set $seedExtra "JWT_SECRET" . }}
            {{- end }}
            {{- with (include "jitsu.devCredential" (dict "ctx" . "key" "SEED_USER_PASSWORD")) }}
            {{- $_ := set $seedExtra "SEED_USER_PASSWORD" . }}
            {{- end }}
            {{- include "jitsu.env" (dict "ctx" . "service" "console"
                  "extra" $seedExtra) | nindent 12 }}
{{- end }}
