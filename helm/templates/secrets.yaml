{{/*
Inter-service auth tokens, when the operator supplies them.

Prod only, and only when `auth.token` is set. Without it the Secret is created
by the token-generator Job instead (see token-generator.yaml) — a template
cannot generate a stable secret, because `lookup` is empty during
`helm template`, `--dry-run` and Argo CD repo-server rendering, so each
reconciliation would emit a new random token and leave pods disagreeing about
the auth key.

Set `auth.token` when the value should come from somewhere you control — an
external secret manager, a SealedSecret, or GitOps.

The key set mirrors dev-deploy.sh's ensure_secrets(): the same eight keys, and
the same `service-admin-account:` prefix on the three read as keyId:secret pairs.
*/}}
{{- if and (eq (include "jitsu.mode" .) "prod") .Values.auth.token }}
apiVersion: v1
kind: Secret
metadata:
  name: jitsu-secrets
  labels:
    {{- include "jitsu.labels" . | nindent 4 }}
    app.kubernetes.io/name: secrets
  annotations:
    # Ahead of everything that mounts it, and ahead of the token-generator Job's
    # weight so an explicit token always wins a race with a leftover Job.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-11"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  RAW_AUTH_TOKENS: {{ .Values.auth.token | quote }}
  BULKER_AUTH_KEY: {{ .Values.auth.token | quote }}
  ROTOR_AUTH_KEY: {{ .Values.auth.token | quote }}
  # ROTOR_AUTH_KEY is what rotor presents when calling bulker. Rotor's own
  # inbound check reads ROTOR_AUTH_TOKENS / ROTOR_RAW_AUTH_TOKENS and nothing
  # else, and returns true for every request when neither is set
  # (services/rotor/src/index.ts checkAuth). The Go services fall back to the
  # bare RAW_AUTH_TOKENS — viper binds both the prefixed and unprefixed name
  # (jitsubase/appbase/app_base.go) — but rotor has no such fallback, so it
  # needs its own key or prod ships an unauthenticated rotor.
  ROTOR_RAW_AUTH_TOKENS: {{ .Values.auth.token | quote }}
  SYNCCTL_AUTH_KEY: {{ .Values.auth.token | quote }}
  CONSOLE_RAW_AUTH_TOKENS: {{ .Values.auth.token | quote }}
  REPOSITORY_AUTH_TOKEN: {{ printf "service-admin-account:%s" .Values.auth.token | quote }}
  CONSOLE_TOKEN: {{ printf "service-admin-account:%s" .Values.auth.token | quote }}
  CONFIG_SOURCE_HTTP_AUTH_TOKEN: {{ printf "service-admin-account:%s" .Values.auth.token | quote }}
  {{- /* Console's session-signing secret (webapps/console/lib/nextauth.config.ts).
         Deliberately NOT auth.token, and not anything derived from it: every
         other key here hands auth.token to a service as a bearer credential and
         it travels on service-to-service requests, so reusing it as the signing
         secret means anyone who obtains one of those credentials can mint their
         own console session, including an admin one.

         Hashing auth.token would not help either — the derivation lives in this
         file, so holding the token still yields the secret. It has to be an
         independent value, which is why this is `required` rather than
         defaulted, exactly like auth.seedPassword below. */}}
  JWT_SECRET: {{ required "auth.token is set, so auth.jwtSecret must be set too. It signs console sessions and must be a DIFFERENT value from auth.token — auth.token is handed to services as a bearer credential, so sharing it would let anyone holding one forge an admin console session." .Values.auth.jwtSecret | quote }}
  {{- /* The seed Job needs this or seedUserAndWorkspace() silently creates no
         user — it requires both email and password — and the install finishes
         with nobody able to sign in. The generated path mints one; this path
         cannot invent it, so it is required rather than defaulted. */}}
  {{- if .Values.seed.enabled }}
  SEED_USER_PASSWORD: {{ required "auth.token is set and seed.enabled is true, so auth.seedPassword must be set too — otherwise the seed Job creates no user and nobody can sign in. Set auth.seedPassword, or seed.enabled=false if you provision users another way." .Values.auth.seedPassword | quote }}
  {{- end }}
{{- end }}
