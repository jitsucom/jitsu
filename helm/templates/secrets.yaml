{{/*
Inter-service auth tokens.

Prod only. In dev, `dev-deploy.sh` creates this Secret before deploying and
this template would fight it, so the dev path is left exactly as it was.

Why this template has to exist: every service mounts `jitsu-secrets` through
`envFrom` **without** `optional: true`. Without it a prod install fails with
`CreateContainerConfigError: secret "jitsu-secrets" not found` on every pod —
the chart would only work on a cluster where the dev script had already run,
which is the opposite of self-hosting ready (JITSU-48).

Token precedence:
  1. `auth.token` — set it to manage the value yourself (external secret
     manager, GitOps, rotation on your own schedule).
  2. The token already in the cluster, read back with `lookup`, so `helm
     upgrade` does NOT rotate it. Rotating mid-upgrade would break every
     service until the last pod restarted.
  3. A generated one, on first install.

`lookup` returns nothing during `helm template` and `--dry-run`, so a rendered
manifest shows a freshly generated token. That is expected: rendering is not
installing, and the value in the cluster is unaffected.

The key set mirrors dev-deploy.sh's ensure_secrets() exactly — the same eight
keys, and the same `service-admin-account:` prefix on the three that are read
as keyId:secret pairs.
*/}}
{{- if eq (include "jitsu.mode" .) "prod" }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace "jitsu-secrets") }}
{{- $current := "" }}
{{- if $existing }}{{ $current = (index $existing.data "RAW_AUTH_TOKENS" | default "" | b64dec) }}{{ end }}
{{- $token := .Values.auth.token | default $current | default (randAlphaNum 32) }}
apiVersion: v1
kind: Secret
metadata:
  name: jitsu-secrets
  labels:
    {{- include "jitsu.labels" . | nindent 4 }}
    app.kubernetes.io/name: secrets
type: Opaque
stringData:
  RAW_AUTH_TOKENS: {{ $token | quote }}
  BULKER_AUTH_KEY: {{ $token | quote }}
  ROTOR_AUTH_KEY: {{ $token | quote }}
  SYNCCTL_AUTH_KEY: {{ $token | quote }}
  CONSOLE_RAW_AUTH_TOKENS: {{ $token | quote }}
  REPOSITORY_AUTH_TOKEN: {{ printf "service-admin-account:%s" $token | quote }}
  CONSOLE_TOKEN: {{ printf "service-admin-account:%s" $token | quote }}
  CONFIG_SOURCE_HTTP_AUTH_TOKEN: {{ printf "service-admin-account:%s" $token | quote }}
{{- end }}
