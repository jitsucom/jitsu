{{- if gt (int .Values.scaling.bulker.replicas) 0 }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bulker
  labels:
    {{- include "jitsu-dev.labels" . | nindent 4 }}
    app.kubernetes.io/name: bulker
spec:
  replicas: {{ .Values.scaling.bulker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: bulker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bulker
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      initContainers:
        - name: build
          image: golang:1.26-bookworm
          workingDir: /src/bulkerapp
          command:
            - sh
            - -c
            - |
              echo "Copying source..."
              cp -r /project/bulker/* /src/
              echo "Waiting for build lock (Go builds are serialized to avoid overloading the node)..."
              flock /go-cache/build.lock \
                go build -buildvcs=false -o /build/bulker .
              echo "Build complete"
          volumeMounts:
            - name: project
              mountPath: /project
              readOnly: true
            - name: build
              mountPath: /build
            - name: go-cache
              mountPath: /go-cache
            - name: src
              mountPath: /src
          env:
            - name: GOCACHE
              value: /go-cache/build
            - name: GOMODCACHE
              value: /go-cache/mod
          # Cap the build so a compile can't starve the kubelet or running
          # pods. Builds are additionally serialized via the flock above, so
          # at most one build is active — and it reuses the shared GOCACHE
          # warmed by whichever build ran first. Go 1.26 is container-aware:
          # GOMAXPROCS follows the cgroup CPU limit automatically.
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "3"
              memory: 3Gi
      containers:
        - name: bulker
          image: debian:bookworm-slim
          command:
            - sh
            - -c
            - |
              apt-get update && apt-get install -y --no-install-recommends ca-certificates && rm -rf /var/lib/apt/lists/*
              exec /build/bulker
          ports:
            - name: http
              containerPort: 3042
              protocol: TCP
            - name: metrics
              containerPort: 9091
              protocol: TCP
          envFrom:
            - secretRef:
                name: jitsu-secrets
            # Connection URLs of the in-cluster dependencies (helm-deps chart).
            # Listed after jitsu-secrets so its keys win over any legacy URL
            # keys there; explicit env entries below still take precedence.
            - secretRef:
                name: jitsu-deps-urls
                optional: true
          env:
            {{- $extra := dict "HTTP_PORT" "3042" }}
            {{- with .Values.bulker.internalMetricsDestination }}
            {{- if .enabled }}
            {{- /* Resolve the metrics ClickHouse connection. Per field:
                   explicit value here > derived from env.common.CLICKHOUSE_URL >
                   in-cluster helm-deps fallback. */ -}}
            {{- $hosts := .hosts }}
            {{- $database := .database }}
            {{- $username := .username }}
            {{- $password := .password }}
            {{- $protocol := .protocol }}
            {{- $chUrl := "" }}
            {{- if $.Values.env }}{{- with $.Values.env.common }}{{- $chUrl = (.CLICKHOUSE_URL | default "") }}{{- end }}{{- end }}
            {{- if $chUrl }}
            {{- $u := urlParse $chUrl }}
            {{- $host := splitList ":" $u.host | first }}
            {{- if not $hosts }}{{- $hosts = list $host }}{{- end }}
            {{- if not $database }}{{- $database = trimPrefix "/" $u.path }}{{- end }}
            {{- with $u.userinfo }}
            {{- $parts := splitList ":" . }}
            {{- if not $username }}{{- $username = first $parts }}{{- end }}
            {{- if and (not $password) (gt (len $parts) 1) }}{{- $password = index $parts 1 }}{{- end }}
            {{- end }}
            {{- if not $protocol }}{{- $protocol = ternary "clickhouse-secure" "clickhouse" (eq $u.scheme "https") }}{{- end }}
            {{- end }}
            {{- /* In-cluster helm-deps ClickHouse fallback for anything still unset. */ -}}
            {{- if not $hosts }}{{- $hosts = list "clickhouse" }}{{- end }}
            {{- $database = default "default" $database }}
            {{- $username = default "default" $username }}
            {{- $password = default "jitsu-dev" $password }}
            {{- $protocol = default "clickhouse" $protocol }}
            {{- $creds := dict "hosts" $hosts "database" $database "username" $username "password" $password "protocol" $protocol "loadAsJson" .loadAsJson }}
            {{- if .cluster }}{{- $_ := set $creds "cluster" .cluster }}{{- end }}
            {{- $dest := dict "id" "metrics" "special" "metrics" "usesBulker" true "type" "clickhouse" "options" .options "credentials" $creds }}
            {{- $_ := set $extra "BULKER_INTERNAL_METRICS_DESTINATION" ($dest | toJson) }}
            {{- end }}
            {{- end }}
            {{- include "jitsu-dev.env" (dict "ctx" . "service" "bulker" "extra" $extra) | nindent 12 }}
          volumeMounts:
            - name: build
              mountPath: /build
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: project
          hostPath:
            path: {{ include "jitsu-dev.projectRoot" . }}
            type: Directory
        - name: build
          emptyDir: {}
        - name: src
          emptyDir: {}
        - name: go-cache
          persistentVolumeClaim:
            claimName: go-cache
---
apiVersion: v1
kind: Service
metadata:
  name: bulker
  labels:
    {{- include "jitsu-dev.labels" . | nindent 4 }}
    app.kubernetes.io/name: bulker
spec:
  type: LoadBalancer
  ports:
    - port: 3042
      targetPort: http
      protocol: TCP
      name: http
    - port: 9091
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    app.kubernetes.io/name: bulker
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
