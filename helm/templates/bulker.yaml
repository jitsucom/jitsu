{{- if gt (int .Values.scaling.bulker.replicas) 0 }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bulker
  labels:
    {{- include "jitsu.labels" . | nindent 4 }}
    app.kubernetes.io/name: bulker
spec:
  replicas: {{ .Values.scaling.bulker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: bulker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      {{- if eq (include "jitsu.mode" .) "prod" }}
      annotations:
        {{- include "jitsu.credentialChecksum" . | nindent 8 }}
      {{- end }}
      labels:
        app.kubernetes.io/name: bulker
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
{{- if include "jitsu.devScaffold" (dict "ctx" . "service" "bulker") }}
      initContainers:
        - name: build
          image: golang:1.26-bookworm
          workingDir: /src/bulkerapp
          command:
            - sh
            - -c
            - |
              echo "Copying source..."
              cp -r /project/bulker/* /src/
              echo "Waiting for build lock (Go builds are serialized to avoid overloading the node)..."
              flock /go-cache/build.lock \
                go build -buildvcs=false -o /build/bulker .
              echo "Build complete"
          volumeMounts:
            - name: project
              mountPath: /project
              readOnly: true
            - name: build
              mountPath: /build
            - name: go-cache
              mountPath: /go-cache
            - name: src
              mountPath: /src
          env:
            - name: GOCACHE
              value: /go-cache/build
            - name: GOMODCACHE
              value: /go-cache/mod
          # Cap the build so a compile can't starve the kubelet or running
          # pods. Builds are additionally serialized via the flock above, so
          # at most one build is active — and it reuses the shared GOCACHE
          # warmed by whichever build ran first. Go 1.26 is container-aware:
          # GOMAXPROCS follows the cgroup CPU limit automatically.
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "3"
              memory: 3Gi
{{- end }}
      containers:
        - name: bulker
          image: {{ include "jitsu.image" (dict "ctx" . "service" "bulker" "dev" "debian:bookworm-slim" "prod" "bulker") }}
          {{- with (include "jitsu.imagePullPolicy" (dict "ctx" . "service" "bulker")) }}
          imagePullPolicy: {{ . }}
          {{- end }}
          {{- with (include "jitsu.resources" (dict "ctx" . "service" "bulker")) }}
          {{- . | nindent 10 }}
          {{- end }}
{{- if include "jitsu.devScaffold" (dict "ctx" . "service" "bulker") }}
          command:
            - sh
            - -c
            - |
              apt-get update && apt-get install -y --no-install-recommends ca-certificates && rm -rf /var/lib/apt/lists/*
              exec /build/bulker
{{- end }}
          ports:
            - name: http
              containerPort: 3042
              protocol: TCP
            - name: metrics
              containerPort: 9091
              protocol: TCP
          envFrom:
            - secretRef:
                name: jitsu-secrets
            # Connection URLs of the in-cluster dependencies (helm-deps chart).
            # Listed after jitsu-secrets so its keys win over any legacy URL
            # keys there; explicit env entries below still take precedence.
            - secretRef:
                name: jitsu-deps-urls
                optional: true
          env:
            {{- include "jitsu.env" (dict "ctx" . "service" "bulker"
                  "extra" (dict "HTTP_PORT" "3042")) | nindent 12 }}
{{- if include "jitsu.devScaffold" (dict "ctx" . "service" "bulker") }}
          volumeMounts:
            - name: build
              mountPath: /build
              readOnly: true
{{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
{{- if include "jitsu.devScaffold" (dict "ctx" . "service" "bulker") }}
      volumes:
        - name: project
          hostPath:
            path: {{ include "jitsu.projectRoot" . }}
            type: Directory
        - name: build
          emptyDir: {}
        - name: src
          emptyDir: {}
        - name: go-cache
          persistentVolumeClaim:
            claimName: go-cache
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: bulker
  labels:
    {{- include "jitsu.labels" . | nindent 4 }}
    app.kubernetes.io/name: bulker
spec:
  type: {{ include "jitsu.serviceType" (dict "ctx" . "service" "bulker" "dev" "LoadBalancer") }}
  ports:
    - port: 3042
      targetPort: http
      protocol: TCP
      name: http
    - port: 9091
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    app.kubernetes.io/name: bulker
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
