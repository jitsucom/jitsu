# Custom Configuration
# Copy this file to values-custom.yaml for environment-specific config
# This file is for non-secret values (hosts, URLs, database names, etc.)
#
# Usage:
#   cp values-custom.example.yaml values-custom.yaml
#   # Edit values-custom.yaml
#   # Then deploy - it will be picked up automatically

# Dependencies (Kafka, Postgres, ClickHouse, MongoDB) live in the separate
# ../helm-deps chart. To use an external instance, set `enabled: false` for it
# in helm-deps/values.yaml (or helm-deps/values-custom.yaml) and provide the
# matching env.common.<VAR> below — explicit env wins over the URLs published
# by the deps chart.

env:
  common:
    # Only used when the in-cluster console is disabled (scaling.console.replicas: 0)
    # CONSOLE_URL: http://host.minikube.internal:3000
    #
    # Only used when the corresponding in-cluster dependency is disabled in
    # helm-deps values (e.g. kafka.enabled: false)
    # KAFKA_BOOTSTRAP_SERVERS: host.minikube.internal:9092
    # DATABASE_URL: postgresql://user:pass@host.minikube.internal:5432/postgres?schema=newjitsu
    # CLICKHOUSE_URL: http://user:pass@host.minikube.internal:8123/default
    # MONGODB_URL: mongodb://user:pass@host.minikube.internal:27017/admin
  console:
    SEED_USER_EMAIL: admin@example.com
    SEED_USER_PASSWORD: changeme
  ingest:
    DEVICE_FUNCTIONS_TIMEOUT_MS: "2000"
