x-clickhouse: &clickhouse
  image: ${CLICKHOUSE_TEST_IMAGE:-clickhouse/clickhouse-server:25.4-alpine}
  ports:
    - "8123"
    - "9000"
  volumes:
    - ./config.xml:/etc/clickhouse-server/config.xml:ro
    - ./users.xml:/etc/clickhouse-server/users.xml:ro
    - ./cluster-sharded.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
  healthcheck:
    test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
    interval: 1s
    timeout: 3s
    retries: 60
  depends_on:
    zookeeper:
      condition: service_healthy

services:
  zookeeper:
    image: zookeeper:3.9
    healthcheck:
      test: ["CMD-SHELL", "zkCli.sh -server zookeeper:2181 ls /"]
      interval: 1s
      timeout: 3s
      retries: 60
  clickhouse_repl01:
    <<: *clickhouse
    hostname: clickhouse_repl01
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_SKIP_USER_SETUP: "1"
      CLICKHOUSE_SHARD: "01"
      CLICKHOUSE_REPLICA: clickhouse_repl01
  clickhouse_repl02:
    <<: *clickhouse
    hostname: clickhouse_repl02
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_SKIP_USER_SETUP: "1"
      CLICKHOUSE_SHARD: "01"
      CLICKHOUSE_REPLICA: clickhouse_repl02
  clickhouse_repl03:
    <<: *clickhouse
    hostname: clickhouse_repl03
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_SKIP_USER_SETUP: "1"
      CLICKHOUSE_SHARD: "02"
      CLICKHOUSE_REPLICA: clickhouse_repl03
  clickhouse_repl04:
    <<: *clickhouse
    hostname: clickhouse_repl04
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_SKIP_USER_SETUP: "1"
      CLICKHOUSE_SHARD: "02"
      CLICKHOUSE_REPLICA: clickhouse_repl04
