name: 🔒 Security Vulnerability Fix

on:
  schedule:
    - cron: "0 8 * * 1" # Every Monday at 8:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (report only, no PRs)"
        required: false
        type: boolean
        default: false
      severity:
        description: "Minimum severity to fix"
        required: false
        type: choice
        options:
          - low
          - moderate
          - high
          - critical
        default: moderate

concurrency:
  group: security-fix
  cancel-in-progress: false

jobs:
  scan-and-fix:
    name: 🔍 Scan & Fix Vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      security-events: read

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: newjitsu

      - name: 🔧 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 🔧 Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: "bulker/**/*.sum"

      - name: 📦 Install dependencies
        if: false
        run: pnpm install --frozen-lockfile
        continue-on-error: true

      - name: 🔍 Run npm audit
        id: npm-audit
        if: false
        run: |
          pnpm audit --json > /tmp/npm-audit.json 2>/dev/null || true
          echo "npm audit complete"
          # Summary for logs
          jq -r '.advisories // {} | length' /tmp/npm-audit.json 2>/dev/null || echo "0"

      - name: 🔍 Run govulncheck
        id: go-vuln
        if: false
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          mkdir -p /tmp/go-vulns

          for moddir in bulker/*/; do
            if [ -f "${moddir}go.mod" ]; then
              modname=$(basename "${moddir}")
              echo "Scanning ${moddir}..."
              govulncheck -C "${{ github.workspace }}/${moddir}" -json ./... > "/tmp/go-vulns/${modname}.json" 2>/dev/null || true
            fi
          done
          jq -s 'flatten' /tmp/go-vulns/*.json > /tmp/go-vulns.json 2>/dev/null || echo '[]' > /tmp/go-vulns.json
          echo "govulncheck complete"

      - name: 🔍 Fetch Dependabot alerts
        id: dependabot
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/dependabot/alerts \
            --jq '[.[] | select(.state == "open") | {
              number: .number,
              cve: .security_advisory.cve_id,
              severity: .security_advisory.severity,
              summary: .security_advisory.summary,
              package: .security_vulnerability.package.name,
              ecosystem: .security_vulnerability.package.ecosystem,
              vulnerable_range: .security_vulnerability.vulnerable_version_range,
              fixed_version: .security_vulnerability.first_patched_version.identifier
            }]' > /tmp/dependabot-alerts.json || echo '[]' > /tmp/dependabot-alerts.json
          echo "Dependabot alerts: $(jq length /tmp/dependabot-alerts.json)"

      - name: 🤖 Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: 🔒 Prepare prompt
        id: prompt
        run: |
          cat > /tmp/claude-prompt.txt << 'EOF'
          You are a security engineer fixing dependency vulnerabilities in a monorepo.

          ## Context
          - Base branch: newjitsu
          - This is a monorepo with Node.js/pnpm workspace and Go modules in bulker/
          - Root package.json has pnpm.overrides for version pinning

          ## Available scan results
          Read /tmp/dependabot-alerts.json — this is the primary source. It is a JSON array of open alerts with fields: number, cve, severity, summary, package, ecosystem, vulnerable_range, fixed_version.

          ## Instructions

          IMPORTANT: All examples below use PLACEHOLDER names. You must substitute real values from the scan results. Do NOT run any placeholder literally.

          1. Read the alerts file: cat /tmp/dependabot-alerts.json | jq .
          2. Check existing PRs to avoid duplicates: gh pr list --search "security" --state open
          3. Process each alert (or batch trivial ones together):

          ### For npm/Node.js packages:
          - Check if the package is a direct dependency: grep -r '"ACTUAL_PKG_NAME"' */package.json libs/*/package.json webapps/*/package.json cli/*/package.json
          - If transitive: add a pnpm override to root package.json. Example pattern for the overrides object: "actual-pkg@<FIXED_VER": "^FIXED_VER"
          - If direct: bump the version in the relevant package.json file
          - After changes: run pnpm install to update the lockfile
          - If pnpm install fails, revert the changes and skip that vulnerability

          ### For Go packages:
          - Use go -C with the actual module path, e.g.: go -C bulker/actual-module-name get actual-pkg@vFIXED && go -C bulker/actual-module-name mod tidy

          ### Creating PRs:
          - Create a new branch from newjitsu: git checkout -b security/fix-ACTUAL-PKG-NAME
          - Stage and commit changes with a descriptive message
          - Push and create PR: git push -u origin HEAD && gh pr create --base newjitsu --title "TITLE" --body "BODY"
          - After creating PR, reset for the next fix: git checkout newjitsu && git reset --hard origin/newjitsu

          ### Grouping:
          - Batch multiple trivial pnpm override fixes (no major version bumps) into one PR
          - Keep major version bumps or risky changes as separate PRs

          ### PR description should include:
          - CVE ID and severity
          - One-sentence vulnerability description
          - What was changed
          - Whether this is a major version bump and any risks

          ## Rules
          - NEVER modify the newjitsu branch directly — always use a new branch
          - NEVER run placeholder commands — always substitute real package names and versions
          - If a fix fails, revert and move on
          EOF

          # Append runtime values
          echo "" >> /tmp/claude-prompt.txt
          echo "## Runtime values" >> /tmp/claude-prompt.txt
          echo "- Repository: ${{ github.repository }}" >> /tmp/claude-prompt.txt
          echo "- Dry run: ${{ inputs.dry_run || 'false' }}" >> /tmp/claude-prompt.txt
          echo "- Min severity: ${{ inputs.severity || 'moderate' }}" >> /tmp/claude-prompt.txt
          echo "- If dry run is true, only output a report — do NOT create branches or PRs." >> /tmp/claude-prompt.txt

      - name: 🔒 Fix vulnerabilities with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          claude --print \
            --allowedTools "Bash(cat:*),Bash(jq:*),Bash(pnpm:*),Bash(go:*),Bash(git:*),Bash(gh:*),Bash(grep:*),Bash(head:*),Bash(npm:*),Bash(sed:*)" \
            --model claude-haiku-4-5-20251001 \
            < /tmp/claude-prompt.txt
