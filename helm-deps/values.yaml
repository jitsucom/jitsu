# Jitsu Dev Dependencies Helm Chart Values

# How the datastores are exposed.
#
# ClusterIP by default, deliberately. These are single-node instances carrying
# the dev credentials below, and `type: LoadBalancer` on a cloud provider gives
# each one a public IP — Postgres 5432, Kafka 9092, ClickHouse 8123/9000 and
# MongoDB 27017 reachable from the internet with those credentials.
#
# dev-deploy.sh passes LoadBalancer explicitly, which is what `minikube tunnel`
# publishes. The default is the safe direction: getting it wrong this way breaks
# a tunnel and is obvious; getting it wrong the other way is silent.
service:
  type: ClusterIP
#
# Single-node in-cluster dependencies for the Jitsu dev chart (../helm).
# dev-deploy.sh deploys this chart first with --wait, so the main services
# only start once every dependency is healthy.
#
# Images are pinned to tested tags rather than :latest so a floating image
# can't change behavior between deploys or force an Always pull that fails
# when the registry is unreachable. Override to upgrade.
#
# The dev credentials below are published to the main chart through the
# `jitsu-deps-urls` Secret (see templates/urls-secret.yaml); they only
# protect in-cluster dev instances, so simple values are fine.
#
# To use an external instance of a dependency: set `enabled: false` here and
# point the matching env.common.KAFKA_BOOTSTRAP_SERVERS / DATABASE_URL /
# CLICKHOUSE_URL / MONGODB_URL of the main chart at it.

kafka:
  enabled: true
  image: docker.redpanda.com/redpandadata/redpanda:v26.1.12
  imagePullPolicy: IfNotPresent

postgres:
  enabled: true
  image: postgres:14
  imagePullPolicy: IfNotPresent
  password: jitsu-dev

clickhouse:
  enabled: true
  image: clickhouse/clickhouse-server:25.4-alpine
  imagePullPolicy: IfNotPresent
  password: jitsu-dev

mongodb:
  enabled: true
  image: mongo:7
  imagePullPolicy: IfNotPresent
  password: jitsu-dev
